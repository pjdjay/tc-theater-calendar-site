<!doctype html>
<html lang="en">
<head>

<script>try{var t=localStorage.getItem("tctheater.theme.v1");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
/* Design tokens: see DESIGN.md. Light values here; the dark block below redefines colours only (the page follows the system setting). */
:root{--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--maxw:760px;--gut:16px;--r-sm:8px;--r-md:12px;--r-card:14px;--r-lg:16px;--r-pill:999px;
--bg:#eceeee;--surface:#fbfbfb;--surface-2:#e0e4e4;--ink:#141414;--ink-2:#363a3a;--muted:#575d5d;--line:#d4d8d8;--line-2:#bcc2c2;
--accent:#00686b;--accent-ink:#fff;--accent-soft:#d3ebea;--warn:#b3261e;--hi:#ffd23f;--hi-ink:#141414;--pop:0 10px 30px rgba(20,20,20,.2);
--g-coral-bg:#fbe0d8;--g-coral-fg:#712b13;--g-blue-bg:#dbe9f8;--g-blue-fg:#0c447c;--g-green-bg:#e3f0d3;--g-green-fg:#27500a;--g-amber-bg:#faeeda;--g-amber-fg:#633806;
--g-grey-bg:#dcdad2;--g-grey-fg:#2c2c2a;--g-orange-bg:#fde3c8;--g-orange-fg:#6b3300;--g-pink-bg:#f9dce8;--g-pink-fg:#72243e;--g-violet-bg:#e6dcf8;--g-violet-fg:#3c3489}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#101314;--surface:#191d1e;--surface-2:#252b2c;--ink:#f7f7f5;--ink-2:#d6d9d8;--muted:#a0a6a5;--line:#2f3637;--line-2:#444c4d;
--accent:#5fd6d0;--accent-ink:#071414;--accent-soft:#143331;--warn:#ff8a7a;--pop:0 10px 30px rgba(0,0,0,.6);
--g-coral-bg:#5a2a1f;--g-coral-fg:#f5c4b3;--g-blue-bg:#1d3a5c;--g-blue-fg:#b5d4f4;--g-green-bg:#2b3f1a;--g-green-fg:#c0dd97;--g-amber-bg:#4a3512;--g-amber-fg:#fac775;
--g-grey-bg:#3a3a38;--g-grey-fg:#d3d1c7;--g-orange-bg:#4d3015;--g-orange-fg:#f7c38f;--g-pink-bg:#4f1f33;--g-pink-fg:#f4c0d1;--g-violet-bg:#363060;--g-violet-fg:#cecbf6}}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#101314;--surface:#191d1e;--surface-2:#252b2c;--ink:#f7f7f5;--ink-2:#d6d9d8;--muted:#a0a6a5;--line:#2f3637;--line-2:#444c4d;
--accent:#5fd6d0;--accent-ink:#071414;--accent-soft:#143331;--warn:#ff8a7a;--pop:0 10px 30px rgba(0,0,0,.6);
--g-coral-bg:#5a2a1f;--g-coral-fg:#f5c4b3;--g-blue-bg:#1d3a5c;--g-blue-fg:#b5d4f4;--g-green-bg:#2b3f1a;--g-green-fg:#c0dd97;--g-amber-bg:#4a3512;--g-amber-fg:#fac775;
--g-grey-bg:#3a3a38;--g-grey-fg:#d3d1c7;--g-orange-bg:#4d3015;--g-orange-fg:#f7c38f;--g-pink-bg:#4f1f33;--g-pink-fg:#f4c0d1;--g-violet-bg:#363060;--g-violet-fg:#cecbf6}
/* type -> colour family (theme-independent; the families above carry the theme) */
.ty[data-t="drama"]{--tbg:var(--g-blue-bg);--tfg:var(--g-blue-fg)}
.ty[data-t="comedy"],.ty[data-t="improv"],.ty[data-t="sketch"]{--tbg:var(--g-amber-bg);--tfg:var(--g-amber-fg)}
.ty[data-t="musical"]{--tbg:var(--g-pink-bg);--tfg:var(--g-pink-fg)}
.ty[data-t="opera"]{--tbg:var(--g-violet-bg);--tfg:var(--g-violet-fg)}
.ty[data-t="ballet"],.ty[data-t="other_dance"]{--tbg:var(--g-coral-bg);--tfg:var(--g-coral-fg)}
.ty[data-t="family"]{--tbg:var(--g-green-bg);--tfg:var(--g-green-fg)}
.ty[data-t="circus"],.ty[data-t="drag"]{--tbg:var(--g-orange-bg);--tfg:var(--g-orange-fg)}
.ty[data-t="other"]{--tbg:var(--g-grey-bg);--tfg:var(--g-grey-fg)}
/* base */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header.top,.sbar,.tools,.sel,.filters,.status,.hmsg,footer{max-width:var(--maxw);margin-left:auto;margin-right:auto;padding-left:var(--gut);padding-right:var(--gut)}
main{max-width:var(--maxw);margin:0 auto;padding:0 0 40px}
/* header */
header.top{padding-top:12px}
h1{display:inline-block;margin:0;font-size:1.6rem;font-weight:700;line-height:1.1;letter-spacing:-.015em;color:var(--accent)}
.updated{display:block;margin-top:3px;color:var(--muted);font-size:.8rem}
/* toolbar and chips */
/* search */
.sbar{margin-top:10px}
.sbox{position:relative}
.sbox input{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;padding:10px 44px 10px 40px;min-height:44px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
.sbox input::placeholder{color:var(--muted)}
.sic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.sclear{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:var(--r-sm);background:none;color:var(--muted);font:inherit;font-size:1.05rem;cursor:pointer}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:30;max-height:min(60vh,420px);overflow-y:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:var(--pop);padding:4px 0}
.sg{padding:8px 12px 2px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.so{display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding:10px 12px;min-height:44px;box-sizing:border-box;cursor:pointer;overflow-wrap:anywhere}
.so small{color:var(--muted);white-space:nowrap}
.so:hover,.so[aria-selected=true]{background:var(--accent-soft)}
.sno{padding:10px 12px;color:var(--muted);font-size:.9rem}
.sel{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sel[hidden]{display:none}
.sel .chip{max-width:100%;text-align:left;overflow-wrap:anywhere}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip,.fbtn{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 13px;border:1px solid var(--line-2);border-radius:var(--r-pill);background:var(--surface);color:var(--ink);font:inherit;font-size:.86rem;font-weight:500;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fbtn{font-weight:650}
.fbtn[aria-expanded=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fbtn .n{background:var(--accent);color:var(--accent-ink);border-radius:var(--r-pill);font-size:.72rem;padding:0 6px;line-height:1.5}
.fbtn[aria-expanded=true] .n{background:var(--accent-ink);color:var(--accent)}
/* jump to date (same control as the music calendar) */
.jd{position:relative;overflow:hidden}
.jd .ic{width:16px;height:16px}
.jd input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;cursor:pointer}
.jd:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-pill);overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:.85rem;padding:5px 14px;min-height:34px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* filter panel */
.filters[hidden]{display:none}
.filters{margin-top:10px}
.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:4px 16px 12px}
.frow{margin:12px 0}
.flabel{margin-bottom:6px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pnote{color:var(--muted);font-size:.78rem;margin-top:4px}
.linkbtn{background:none;border:0;padding:7px 0;margin:-7px 0 -7px 6px;font:inherit;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;min-height:30px}
.clear{background:none;border:0;color:var(--accent);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;padding:8px 0;min-height:34px}
.status{padding-top:10px;padding-bottom:4px;color:var(--muted);font-size:.8rem}
.status:empty{display:none}
.hmsg{color:var(--warn);font-weight:600;padding-top:6px;padding-bottom:0}
/* day header */
.day{content-visibility:auto;contain-intrinsic-size:auto 640px}   /* off-screen days skip layout and paint: fast with thousands of cards */
.day+.day{margin-top:18px}
.status:empty+main .day:first-child{margin-top:6px}
.day h2{position:sticky;top:0;z-index:2;margin:0;display:flex;align-items:center;gap:10px;padding:10px var(--gut) 6px;background:var(--bg);line-height:1.15}
.day h2::after{content:"";position:absolute;left:0;right:0;top:100%;height:10px;background:linear-gradient(var(--bg),transparent);pointer-events:none}   /* cards fade out under the sticky heading instead of being cut flush */
.leaf{display:inline-flex;flex-direction:column;flex:none;width:44px;border:1.5px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface);text-align:center}
.lm{padding:2px 0;background:var(--accent);color:var(--accent-ink);font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ld{font-size:1.25rem;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums;color:var(--ink)}
.lw{font-size:1.15rem;font-weight:700;color:var(--ink)}
.day h2 small{margin-left:auto;white-space:nowrap;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
/* performance card */
section.day>ul{list-style:none;margin:0;padding:4px var(--gut) 0;display:flex;flex-direction:column;gap:8px}
li.ev{position:relative;padding:12px 14px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card)}   /* flat: no shadow, no hover, no pointer (the card itself is not a link) */
/* room for the heart (Step 8): a 30px slot in the top-right corner; text never runs under it */
.hslot{position:absolute;top:6px;right:8px;width:30px;height:30px}
li.ev>.tm,li.ev>.kick,li.ev>.l1{padding-right:40px}
/* heart (ported from music): outline when off, filled accent when on; shape and aria-pressed carry the state, not colour alone */
.heart{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border:0;border-radius:var(--r-sm);background:none;color:var(--muted);cursor:pointer}
.heart .ic{width:19px;height:19px;display:block}
.heart:hover{background:var(--surface-2)}
.heart[aria-pressed=true]{color:var(--accent);background:var(--accent-soft)}
.heart[aria-pressed=true] .ic{fill:currentColor}
li.ev.gone{background:transparent;border-style:dashed;border-color:var(--line-2)}
.gonenote{display:block;margin-top:3px;color:var(--ink-2);font-size:.84rem;font-style:italic}
.hclear{padding:14px var(--gut) 0;color:var(--muted);font-size:.85rem}
.hclear .linkbtn{padding:8px 10px 8px 0;margin:0}
.hnote{margin-top:6px}
.tm{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:1.05rem;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums;color:var(--ink)}
.tm.tba{color:var(--muted)}
.kick{margin-top:2px;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}
.kick .co{color:var(--ink-2)}
.l1{margin-top:2px}
.h{font-weight:700;font-size:1.24rem;line-height:1.22;letter-spacing:-.005em;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
a.h{display:inline-block;padding:4px 0}   /* titles use the ink colour like music: accent-coloured titles read weaker */
a.h:hover,a.h:focus-visible{text-decoration:underline;color:var(--accent)}
a.h .ext{font-size:.8em;font-weight:400;margin-left:4px;color:var(--accent)}
.badge{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:var(--r-pill);font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;vertical-align:.15em}
.badge.sold{background:var(--hi);color:var(--hi-ink)}
.badge.off{background:var(--warn);color:var(--bg)}
.badge.ext{background:var(--accent-soft);color:var(--accent)}
.soon{display:inline-block;padding:1px 9px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent);font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;margin-top:3px;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.meta>*+*::before{content:"\00b7";display:inline-block;margin:0 6px;font-weight:400;color:var(--muted)}
.meta>.ty{margin-right:4px;padding:1px 9px;border-radius:var(--r-pill);background:var(--tbg,var(--surface-2));color:var(--tfg,var(--ink-2));font-size:.74rem;font-weight:700}
.meta>.ty::before{content:none}
.meta>.ty+*::before{content:none}
.meta>.price{font-weight:700;color:var(--ink)}
.meta .dflt{font-style:italic}
.acc{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px}
.acc span{padding:1px 8px;border:1px solid var(--line-2);border-radius:var(--r-pill);font-size:.72rem;font-weight:700;color:var(--ink-2)}
.links{display:flex;flex-wrap:wrap;align-items:center;margin-top:2px;font-size:.78rem;color:var(--muted)}
.links a{display:inline-block;padding:7px 0;margin:-3px 0;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.links>*+*::before{content:"\00b7";display:inline-block;margin:0 6px;color:var(--muted)}
.links .al{color:var(--muted)}
.links .al a{color:var(--muted)}
details.note{margin-top:2px;font-size:.76rem;color:var(--muted)}
details.note summary{display:flex;align-items:center;min-height:30px;cursor:pointer;list-style:none}
details.note summary::-webkit-details-marker{display:none}
details.note summary::before{content:"i";display:inline-flex;align-items:center;justify-content:center;flex:none;width:14px;height:14px;margin-right:6px;border:1.5px solid currentColor;border-radius:50%;font:700 .6rem/1 var(--font)}
details.note summary:hover,details.note[open] summary{color:var(--ink-2)}
details.note p{margin:0 0 4px;padding-left:20px;line-height:1.35}
/* cancelled / postponed: muted text, not opacity (opacity would drop text below 4.5:1) */
li.ev.off{background:transparent;border-style:dashed;border-color:var(--line-2)}
li.ev.off .h,li.ev.off .tm,li.ev.off .kick .co,li.ev.off .meta>.price{color:var(--muted)}
li.ev.off .h{text-decoration:line-through}
li.ev.off .ty{--tbg:var(--surface-2);--tfg:var(--muted)}
/* list controls */
.nextwk{display:block;margin:16px auto 0;padding:10px 20px;min-height:44px;border:1px solid var(--accent);border-radius:var(--r-pill);background:var(--surface);color:var(--accent);font:inherit;font-weight:700;cursor:pointer}
.more{display:block;margin:4px 0 0;border:0;background:none;color:var(--accent);font:inherit;font-weight:700;padding:12px var(--gut);min-height:44px;cursor:pointer;text-align:left}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.totop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:0;border-radius:var(--r-pill);background:var(--ink);color:var(--bg);box-shadow:var(--pop);font:inherit;font-size:.9rem;font-weight:700;cursor:pointer}
footer{padding-top:16px;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:.8rem}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* desktop: one centred column, wider gutter */
@media (min-width:960px){
:root{--maxw:820px;--gut:24px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
h1{font-size:1.75rem}
.updated{margin:0 0 6px}
li.ev{padding:14px 18px 10px}
.day+.day{margin-top:28px}
}
</style>
</head>
<body>
<header class="top"><h1>Twin Cities Theater</h1><span class="updated" id="updated"></span></header>
<div class="sbar" id="sbar"><div class="sbox">
<svg class="sic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
<input type="text" id="q" placeholder="Search show, company or venue" aria-label="Search show, company or venue" role="combobox" aria-expanded="false" aria-controls="sug" aria-autocomplete="list" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
<button type="button" class="sclear" id="qclear" aria-label="Clear search" hidden>✕</button>
<div class="sug" id="sug" role="listbox" aria-label="Suggestions" hidden></div>
</div></div>
<div class="tools"><button type="button" class="fbtn" id="fbtn" aria-controls="filters" aria-expanded="false">Filters</button><button type="button" class="chip" id="soon" aria-pressed="false">Closing soon</button><button type="button" class="chip" id="hchip" aria-pressed="false">Hearted (0)</button><label class="jd chip"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span aria-hidden="true">Date</span><input type="date" id="jump-date" aria-label="Jump to date"></label></div>
<div class="sel" id="sel" role="group" aria-label="Active search filters" hidden></div>
<div class="filters" id="filters" hidden><div class="fpanel">
<div class="frow"><div class="flabel" id="l-types">Type</div><div class="chips" id="f-types" role="group" aria-labelledby="l-types"></div></div>
<div class="frow"><div class="flabel" id="l-levels">Producer</div><div class="chips" id="f-levels" role="group" aria-labelledby="l-levels"></div></div>
<div class="frow"><div class="flabel" id="l-ages">Age</div><div class="chips" id="f-ages" role="group" aria-labelledby="l-ages"></div><div class="pnote">Grouped by the youngest age the listing recommends.</div></div>
<div class="frow"><div class="flabel" id="l-acc">Accessibility</div><div class="chips" id="f-acc" role="group" aria-labelledby="l-acc"></div><div class="pnote">Only performances the listing names. A performance without a tag may still offer it: check with the theater.</div></div>
<div class="frow"><div class="flabel" id="l-cities">City</div><div class="chips" id="f-cities" role="group" aria-labelledby="l-cities"></div></div>
<div class="frow"><div class="flabel" id="l-theme">Appearance</div><div class="seg" id="f-theme" role="group" aria-labelledby="l-theme"></div></div>
<button class="clear" id="f-clear" type="button">Clear filters</button>
</div></div>
<div class="hmsg" id="hmsg" role="status" hidden></div>
<div class="status" id="status" role="status"></div>
<main id="days"></main>
<button class="nextwk" id="nextwk" type="button" hidden></button>

 if(p.co)k.push('<span class="co"'+(p.cf?' title="'+esc(p.cf)+'"':"")+'>'+esc(p.co)+'</span>');
 k.push('<span'+(p.vf?' title="'+esc(p.vf)+'"':"")+'>'+esc(p.v+(p.sg?", "+p.sg:""))+'</span>');
 if(p.y.toLowerCase()!==(p.co||p.v).toLowerCase())k.push('<span>'+esc(p.y)+'</span>');   // not "Chanhassen \u00b7 Chanhassen"
 h+='<div class="kick">'+k.join(" · ")+'</div>';
 h+='<div class="l1">';
 h+=main?'<a class="h" href="'+esc(main)+'" target="_blank" rel="noopener noreferrer">'+esc(p.t)+'<span class="ext" aria-hidden="true">↗</span><span class="vh"> (opens in a new tab)</span></a>':'<span class="h">'+esc(p.t)+'</span>';
 var bt=STATUS_LABEL[p.st];
 if(bt)h+='<span class="badge '+(p.st==="sold_out"?"sold":p.st==="extended"?"ext":"off")+'">'+esc(bt)+'</span>';
 h+='</div>';
 var m='<span class="ty" data-t="'+esc(p.ty)+'">'+esc(TYPE_LABEL[p.ty]||p.ty)+'</span>';
 if(p.ag)m+='<span>'+esc(p.ag)+(p.ad?' <span class="dflt">(usual for this company)</span>':"")+'</span>';
 if(p.pr)m+='<span class="price">'+esc(p.pr)+'</span>';
 h+='<div class="meta">'+m+'</div>';
 if(p.ac.length)h+='<div class="acc">'+p.ac.map(function(a){return "<span>"+esc(ACC_LABEL[a]||a)+"</span>"}).join("")+'</div>';
 var L=[];
 if(link(p.tk)&&link(p.su)&&p.su!==p.tk)L.push('<a href="'+esc(p.su)+'" target="_blank" rel="noopener noreferrer">'+(p.lh?"Company calendar":"Event page")+'</a>');
 else if(!link(p.tk)&&p.lh)L.push('<span>Company calendar page</span>');
 if(p.al&&p.al.length){var a=[];p.al.forEach(function(x){if(link(x.u))a.push('<a href="'+esc(x.u)+'" target="_blank" rel="noopener noreferrer">'+esc(x.n)+'</a>')});
  if(a.length)L.push('<span class="al">Also on: '+a.join(", ")+'</span>')}
 if(L.length)h+='<div class="links">'+L.join("")+'</div>';
 if(p.b==="p")h+='<details class="note"><summary>From the weekly schedule</summary><p>This company publishes a weekly pattern of show times, not a date-by-date calendar, so holiday, added or dark dates may differ. Check with the theater before you go.</p></details>';
 else if(p.b==="r")h+='<details class="note"><summary>Dates only</summary><p>The days and times are not confirmed. Check with the theater.</p></details>';
 return cache[i]=h+"</li>";
}

// filters: any chosen chip within a group, every group must match; applied before the daily limit
function setOf(a){var o={};a.forEach(function(v){o[v]=1});return o}
// ---- search: show titles, companies and venues, normalized and indexed once on load. Not saved; looks at all 12 weeks. ----
function norm(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim()}
var q={k:"",label:"",venues:[],cos:[]};   // k: free text or a chosen show title; venues and cos: chosen chips
function searching(){return q.k!==""||q.venues.length>0||q.cos.length>0}
var TIDX=Object.create(null),CIDX=Object.create(null),VIDX=Object.create(null);
P.forEach(function(p){
 p._s=norm(p.t+" "+(p.co||"")+" "+p.v+" "+p.y);
 if(p.d<TODAY)return;   // only upcoming performances are suggested
 function add(m,n){var k=norm(n);if(!k)return;var o=m[k];if(o)o.c++;else m[k]={n:n,k:k,c:1}}
 add(TIDX,p.t);if(p.co)add(CIDX,p.co);add(VIDX,p.v)});
function toList(m){return Object.keys(m).map(function(k){return m[k]})}
var TLIST=toList(TIDX),CLIST=toList(CIDX),VLIST=toList(VIDX);
function matcher(){
 var T=setOf(st.types),Lv=setOf(st.levels),A=setOf(st.ages),C=setOf(st.cities),X=st.acc;
 return function(p){
  if(st.types.length&&!T[p.ty])return false;
  if(st.levels.length&&!Lv[p.lv])return false;
  if(st.ages.length&&!A[p.ab])return false;
  if(st.cities.length&&!C[p.y])return false;
  if(st.soon&&!p.cs)return false;
  if(q.k&&p._s.indexOf(q.k)<0)return false;
  if(q.venues.length&&q.venues.indexOf(p.v)<0)return false;
  if(q.cos.length&&q.cos.indexOf(p.co||"")<0)return false;
  if(X.length){var ok=false;for(var j=0;j<X.length;j++)if(p.ac.indexOf(X[j])>-1){ok=true;break}if(!ok)return false}
  return true};
}
var WEEKS=D.weeks||12,STEP=D.step||4,shown=Math.min(STEP,WEEKS);   // weeks opened so far: never saved, every visit starts at STEP
var expanded={};
var daysEl=$("days");
function render(){
 var HV=heartView,S=searching(),ok=matcher(),days=[],byD={},total=0,anyFuture=false,cut=weekCut(TODAY,shown),hid={},nHid=0;
 function add(d,it){var g=byD[d];if(!g){g=byD[d]={d:d,i:[]};days.push(g)}g.i.push(it);total++}
 function hide(k){if(!hid[k]){hid[k]=1;nHid++}}
 for(var i=0;i<P.length;i++){var p=P[i];
  if(p.d<TODAY)continue;           // past days are hidden by the viewer's clock
  anyFuture=true;
  if(HV){if(!Marks.get(p.pk))continue}   // hearted view: hearted performances in every week, open or closed
  else if(!S&&p.d>=cut)continue;       // a search looks at all 12 weeks       // closed weeks: filters and the count see only what is open
  if(!ok(p)){if(HV)hide(p.pk);continue}
  add(p.d,i)}
 ORPH={};
 if(HV){   // hearts with no listed performance any more: shown from the snapshot (it has no type or age, so no filter can hide it)
  Marks.keys().forEach(function(k){if(EK[k])return;var m=Marks.get(k);if(m.snap.d<TODAY)return;
   if(!orphOk(m.snap)){hide(k);return}
   ORPH[k]=m.snap;add(m.snap.d,k)});
  days.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0})}
 var out=[];
 days.forEach(function(day){
  var dt=ymd(day.d),n=day.i.length,lim=!HV&&LIMIT>0&&!expanded[day.d]&&n>LIMIT?LIMIT:n,cards=[];
  for(var j=0;j<lim;j++){var it=day.i[j];cards.push(typeof it==="number"?card(it):goneCard(it,ORPH[it]))}
  out.push('<section class="day" data-d="'+day.d+'"><h2><span class="leaf" aria-hidden="true"><span class="lm">'+MON[dt.getUTCMonth()]+'</span><span class="ld">'+dt.getUTCDate()+'</span></span><span class="lw">'+WD[dt.getUTCDay()]+'<span class="vh">, '+MON[dt.getUTCMonth()]+" "+dt.getUTCDate()+'</span></span><small>'+n+" performance"+(n===1?"":"s")+'</small></h2><ul>'+cards.join("")+'</ul>'+(lim<n?'<button type="button" class="more" data-more="'+day.d+'">Show '+(n-lim)+' more</button>':"")+'</section>');
 });
 if(!out.length)out.push('<div class="empty">'+(HV&&!nHid?"No hearted performances yet. Tap the heart on a performance to keep it here.":(nActive()||S)?'No performances match '+(S&&!nActive()?'this search':'these filters')+(!S&&shown<WEEKS?" in the weeks shown":"")+'.<br><button type="button" class="linkbtn" data-clear="1">Clear filters</button>':anyFuture?"No performances listed.":"This listing has ended. Reload the page for the latest one.")+'</div>');
 daysEl.innerHTML=out.join("");
 if(HV&&Marks.keys().length)daysEl.appendChild(clearBox());
 var s=$("status");
 s.innerHTML=HV&&nHid?nHid+" hidden by filters"+' <button type="button" class="linkbtn" data-clear="1">Clear filters</button>':(nActive()||S)?total+" performance"+(total===1?"":"s")+' match <button type="button" class="linkbtn" data-clear="1">Clear filters</button>':"";
 var fb=$("fbtn"),c=nActive();
 fb.innerHTML="Filters"+(c?' <span class="n">'+c+"</span>":"");
 $("soon").setAttribute("aria-pressed",st.soon?"true":"false");
 var nb=$("nextwk");nb.hidden=HV||S||shown>=WEEKS;   // everything open: no button
 if(!nb.hidden){var more=Math.min(STEP,WEEKS-shown);nb.textContent="Show next "+more+(more===1?" week":" weeks")}
 syncHearts();
}
function clearBox(){   // the reset: a text button, then an inline "are you sure" (no browser dialog)
 var box=document.createElement("div"),b=document.createElement("button");box.className="hclear";b.type="button";b.className="linkbtn";b.textContent="Clear all hearts";box.appendChild(b);
 b.onclick=function(){box.textContent="";
  var t=document.createElement("span");t.textContent="Remove all "+heartKeys().length+" hearts? This can\u2019t be undone. ";box.appendChild(t);
  var y=document.createElement("button"),n=document.createElement("button");y.type=n.type="button";y.className=n.className="linkbtn";y.textContent="Remove all";n.textContent="Cancel";
  y.onclick=function(){Marks.clear();heartView=false;hBtn.setAttribute("aria-pressed","false");render();hBtn.focus()};   // nothing left to show: leave the hearted view
  n.onclick=function(){render();hBtn.focus()};
  box.appendChild(y);box.appendChild(n);n.focus()};
 return box}
var hBtn=$("hchip"),hMsg=$("hmsg");
function syncHearts(){   // repaints the buttons, the count and the storage warning; a card never vanishes under the finger (it goes at the next render)
 Array.prototype.forEach.call(document.querySelectorAll("button.heart"),function(b){var on=!!Marks.get(b.getAttribute("data-k"));
  b.setAttribute("aria-pressed",on?"true":"false");b.title=on?"Hearted. Tap to remove (saved on this device only)":"Heart this performance (saved on this device only)"});
 var n=heartKeys().length;hBtn.textContent="Hearted ("+n+")";hBtn.setAttribute("aria-label","Hearted performances, "+n);
 var s=Marks.status(),m="";
 if(s==="full")m="This browser\u2019s storage is full, so your hearts are not being saved. They last until you close this page.";
 else if(s==="unavailable"&&Marks.keys().length)m="This browser is blocking storage, so your hearts are not being saved. They last until you close this page.";
 hMsg.textContent=m;hMsg.hidden=!m}
function chips(){
 GROUPS.forEach(function(g){
  var key=g[0],labels=g[2],vals=Object.keys(present[key]);
  if(key==="cities")vals.sort(function(a,b){return cityN[b]-cityN[a]||(a<b?-1:1)});
  else if(key==="types")vals=Object.keys(TYPE_LABEL).filter(function(v){return present.types[v]});
  else if(key==="levels")vals=Object.keys(LEVEL_LABEL).filter(function(v){return present.levels[v]});
  else if(key==="ages")vals=Object.keys(AGE_LABEL).filter(function(v){return present.ages[v]});
  else if(key==="acc")vals=Object.keys(ACC_LABEL).filter(function(v){return present.acc[v]});
  $(g[1]).innerHTML=vals.map(function(v){return '<button type="button" class="chip" data-g="'+key+'" data-v="'+esc(v)+'" aria-pressed="'+(st[key].indexOf(v)>-1)+'">'+esc(labels?labels[v]:v)+"</button>"}).join("");
 });
}
function clearAll(){st={types:[],levels:[],ages:[],acc:[],cities:[],soon:false};save();q.k=q.label="";q.venues=[];q.cos=[];resetBox();syncSel();chips();render()}
$("filters").addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.id==="f-clear"){clearAll();return}
 var g=b.getAttribute("data-g");if(!g)return;
 var v=b.getAttribute("data-v"),a=st[g],i=a.indexOf(v);
 if(i>-1)a.splice(i,1);else a.push(v);
 b.setAttribute("aria-pressed",i>-1?"false":"true");save();render();
});
$("fbtn").addEventListener("click",function(){var f=$("filters"),open=f.hidden;f.hidden=!open;this.setAttribute("aria-expanded",open?"true":"false")});
$("soon").addEventListener("click",function(){st.soon=!st.soon;save();render()});
$("nextwk").addEventListener("click",function(){shown=Math.min(WEEKS,shown+STEP);render()});
hBtn.addEventListener("click",function(){heartView=!heartView;hBtn.setAttribute("aria-pressed",heartView?"true":"false");window.scrollTo(0,0);render()});
Marks.subscribe(syncHearts);
window.addEventListener("storage",function(ev){if(ev.key==="tctheater.marks.v1"||ev.key===null)Marks.reload()});   // another tab hearted something
document.addEventListener("click",function(e){
 var b=e.target.closest&&e.target.closest("button");if(!b)return;
 if(b.classList.contains("heart")){var k=b.getAttribute("data-k"),i=b.getAttribute("data-i");
  if(Marks.get(k))Marks.set(k,null);
  else{var sn=i!==null?snapOf(P[+i]):ORPH[k];if(sn)Marks.set(k,{snap:sn})}
  return}
 if(b.getAttribute("data-clear")){clearAll();return}
 var d=b.getAttribute("data-more");if(d){expanded[d]=1;render()}
});
function orphOk(g){   // a saved snapshot has a title and venue only: a company chip cannot be checked, so it hides orphans
 if(q.k&&norm(g.h+" "+g.v).indexOf(q.k)<0)return false;
 if(q.venues.length&&q.venues.indexOf(g.v)<0)return false;
 return !q.cos.length}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function rank(k,t){var i=k.indexOf(t);return i<0?-1:i===0?0:k.indexOf(" "+t)>=0?1:2}
function pick(list,t,skip){var out=[];
 for(var i=0;i<list.length;i++){if(skip&&skip(list[i]))continue;var r=rank(list[i].k,t);if(r>=0)out.push([r,list[i]])}
 out.sort(function(a,b){return a[0]-b[0]||b[1].c-a[1].c||(a[1].n<b[1].n?-1:a[1].n>b[1].n?1:0)});
 return out.slice(0,6).map(function(x){return x[1]})}
var inp=$("q"),sug=$("sug"),qclear=$("qclear"),sel=$("sel"),sbar=$("sbar");
var opts=[],act=-1,timer=0;
function setAct(i){
 if(act>=0&&opts[act])opts[act].el.setAttribute("aria-selected","false");
 act=i;
 if(i>=0&&opts[i]){opts[i].el.setAttribute("aria-selected","true");inp.setAttribute("aria-activedescendant",opts[i].el.id);opts[i].el.scrollIntoView({block:"nearest"})}
 else inp.removeAttribute("aria-activedescendant")}
function closeList(){sug.hidden=true;inp.setAttribute("aria-expanded","false");opts=[];act=-1;inp.removeAttribute("aria-activedescendant")}
function group(label,items,type){
 if(!items.length)return;
 sug.appendChild(el("div","sg",label)).setAttribute("role","presentation");
 items.forEach(function(it){
  var d=el("div","so");d.id="so-"+opts.length;d.setAttribute("role","option");d.setAttribute("aria-selected","false");
  d.appendChild(el("span",null,it.n));d.appendChild(el("small",null,it.c+(it.c===1?" performance":" performances")));
  var o={t:type,i:it,el:d};opts.push(o);
  d.onmousedown=function(ev){ev.preventDefault()};   // keep focus in the box
  d.onclick=function(){choose(o,true)};
  sug.appendChild(d)})}
function suggest(){
 var t=norm(inp.value);
 if(t.length<2){closeList();return}
 sug.textContent="";opts=[];act=-1;
 group("Shows",pick(TLIST,t,function(x){return x.k===q.k}),"t");
 group("Companies",pick(CLIST,t,function(x){return q.cos.indexOf(x.n)>=0}),"c");
 group("Venues",pick(VLIST,t,function(x){return q.venues.indexOf(x.n)>=0}),"v");
 if(!opts.length)sug.appendChild(el("div","sno","No show, company or venue matches \u201c"+inp.value.trim()+"\u201d. Press Enter to search anyway."));
 sug.hidden=false;inp.setAttribute("aria-expanded","true");inp.removeAttribute("aria-activedescendant")}
function syncSel(){
 sel.textContent="";
 function c(label,aria,fn){var b=el("button","chip",label+" \u2715");b.type="button";b.setAttribute("aria-pressed","true");b.setAttribute("aria-label","Remove filter: "+aria);b.onclick=fn;sel.appendChild(b)}
 q.cos.forEach(function(n){c(n,"company "+n,function(){q.cos.splice(q.cos.indexOf(n),1);syncSel();render()})});
 q.venues.forEach(function(n){c(n,"venue "+n,function(){q.venues.splice(q.venues.indexOf(n),1);syncSel();render()})});
 if(q.k)c("\u201c"+q.label+"\u201d","text "+q.label,function(){q.k=q.label="";syncSel();render()});
 sel.hidden=!sel.firstChild}
function setText(label){var k=norm(label);if(!k)return;q.k=k;q.label=label.trim().replace(/\s+/g," ");syncSel();render()}
function resetBox(){clearTimeout(timer);inp.value="";qclear.hidden=true;closeList()}
function choose(o,pointer){
 if(o.t==="v"){if(q.venues.indexOf(o.i.n)<0)q.venues.push(o.i.n);syncSel();render()}
 else if(o.t==="c"){if(q.cos.indexOf(o.i.n)<0)q.cos.push(o.i.n);syncSel();render()}
 else setText(o.i.n);
 resetBox();if(pointer)inp.blur()}
inp.addEventListener("input",function(){qclear.hidden=!inp.value;clearTimeout(timer);
 if(norm(inp.value).length<2){closeList();return}
 timer=setTimeout(suggest,150)});
inp.addEventListener("focus",function(){if(norm(inp.value).length>=2&&sug.hidden)suggest()});
inp.addEventListener("keydown",function(ev){
 var k=ev.key;
 if(k==="ArrowDown"||k==="ArrowUp"){
  ev.preventDefault();clearTimeout(timer);
  if(sug.hidden)suggest();
  if(!opts.length)return;
  setAct(k==="ArrowDown"?(act+1)%opts.length:(act<=0?opts.length-1:act-1))
 }else if(k==="Enter"){
  ev.preventDefault();clearTimeout(timer);
  if(!sug.hidden&&act>=0&&opts[act])choose(opts[act],false);
  else if(norm(inp.value)){setText(inp.value);resetBox()}
 }else if(k==="Escape"){if(!sug.hidden){ev.preventDefault();closeList()}}});
qclear.onclick=function(){resetBox();inp.focus()};
document.addEventListener("pointerdown",function(ev){if(!sbar.contains(ev.target))closeList()});
var topBtn=$("top");
window.addEventListener("scroll",function(){topBtn.hidden=window.pageYOffset<window.innerHeight*1.5},{passive:true});
topBtn.addEventListener("click",function(){window.scrollTo(0,0)});
$("updated").textContent="Updated "+D.updated+(D.window?" · "+D.window:"");
$("foot").textContent=D.footer;
var hnote=document.createElement("div");hnote.className="hnote";hnote.textContent="Hearts are saved on this device and in this browser only. They do not sync, and clearing your browser data removes them.";$("foot").appendChild(hnote);
// jump to date: scrolls only (filters stay), not saved, shareable as #YYYY-MM-DD
var jumpIn=$("jump-date"),ISO=/^\d{4}-\d{2}-\d{2}$/;
(function(){var f="",l="";P.forEach(function(p){if(p.d>=TODAY){if(!f||p.d<f)f=p.d;if(p.d>l)l=p.d}});if(f){jumpIn.min=f>TODAY?TODAY:f;jumpIn.max=l}})();
function fmtDay(d){var x=ymd(d);return WD[x.getUTCDay()]+", "+MON[x.getUTCMonth()]+" "+x.getUTCDate()}
function smooth(){try{return !window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}}
function jumpTo(iso,setHash){
 if(!ISO.test(iso))return;
 var need=weeksFor(TODAY,iso,shown,STEP,WEEKS);
 if(need>shown){shown=need;render()}   // a date in a closed week opens it (not remembered)
 var secs=daysEl.querySelectorAll("section.day"),target=null,st2=$("status");
 for(var i=0;i<secs.length;i++){if(secs[i].getAttribute("data-d")>=iso){target=secs[i];break}}
 jumpIn.value=iso;
 if(setHash){try{history.replaceState(null,"","#"+iso)}catch(e){}}
 var why=(nActive()||searching())?" with these filters":"";
 if(!target){st2.textContent="No performances on or after "+fmtDay(iso)+why+".";return}
 target.scrollIntoView({behavior:smooth()?"smooth":"auto",block:"start"});
 var td=target.getAttribute("data-d");
 if(td!==iso)st2.textContent="No performances on "+fmtDay(iso)+why+"; showing "+fmtDay(td)+".";
}
jumpIn.addEventListener("change",function(){if(jumpIn.value)jumpTo(jumpIn.value,true)});
jumpIn.addEventListener("click",function(){try{if(jumpIn.showPicker)jumpIn.showPicker()}catch(e){}});
function fromHash(){var h=location.hash.slice(1);if(ISO.test(h))jumpTo(h,false)}
window.addEventListener("hashchange",fromHash);
// theme (Auto | Light | Dark); the <head> script applied the saved value before first paint
(function(){var box=$("f-theme"),root=document.documentElement;
 function cur(){var t=root.getAttribute("data-theme");return t==="light"||t==="dark"?t:"auto"}
 function sync(){var c=cur();Array.prototype.forEach.call(box.children,function(b){b.setAttribute("aria-pressed",b.getAttribute("data-v")===c?"true":"false")})}
 [["auto","Auto"],["light","Light"],["dark","Dark"]].forEach(function(o){var b=document.createElement("button");b.type="button";b.textContent=o[1];b.setAttribute("data-v",o[0]);
  b.addEventListener("click",function(){if(o[0]==="auto")root.removeAttribute("data-theme");else root.setAttribute("data-theme",o[0]);
   try{if(o[0]==="auto")localStorage.removeItem("tctheater.theme.v1");else localStorage.setItem("tctheater.theme.v1",o[0])}catch(e){}sync()});box.appendChild(b)});
 sync()})();
chips();render();fromHash();
})();
